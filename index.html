
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator Pro</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg,#101522,#252c40);
  font-family: Arial, sans-serif;
  color: white;
  padding: 15px;
}
.app {
  width: 100%;
  max-width: 370px;
  background: #171b27;
  border-radius: 28px;
  padding: 22px;
  box-shadow: 0 20px 60px #0008;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.header h2 { margin: 0; font-size: 21px; }
.header button {
  border: none;
  color: white;
  background: #303648;
  border-radius: 12px;
  padding: 10px;
  cursor: pointer;
}
.display {
  min-height: 135px;
  background: #10131c;
  border-radius: 20px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  text-align: right;
  margin-bottom: 18px;
  overflow: hidden;
}
#history {
  color: #8d95a9;
  font-size: 14px;
  min-height: 20px;
  overflow-wrap: anywhere;
}
#screen {
  font-size: clamp(32px, 9vw, 44px);
  font-weight: bold;
  overflow-wrap: anywhere;
  margin-top: 8px;
}
.keys {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 10px;
}
.key {
  height: 63px;
  border: none;
  border-radius: 18px;
  font-size: 21px;
  font-weight: bold;
  color: white;
  background: #292f40;
  cursor: pointer;
  transition: transform .1s, filter .1s;
  touch-action: manipulation;
}
.key:active { transform: scale(.94); filter: brightness(1.3); }
.utility { background: #42495b; }
.operator { background: #ff9638; color: #171717; }
.equal {
  background: #55d6a2;
  color: #10251d;
}
.zero { grid-column: span 2; }
.footer {
  color: #777f92;
  text-align: center;
  font-size: 12px;
  margin-top: 17px;
}
#log {
  display: none;
  background: #10131c;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 15px;
  max-height: 140px;
  overflow-y: auto;
  font-size: 14px;
}
#log div {
  padding: 7px 0;
  border-bottom: 1px solid #303648;
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h2>🧮 Kalkulator Pro</h2>
    <button onclick="toggleHistory()">📋 Riwayat</button>
  </div>

  <div id="log"></div>

  <div class="display">
    <div id="history"></div>
    <div id="screen" aria-live="polite">0</div>
  </div>

  <div class="keys">
    <button class="key utility" onclick="clearAll()">AC</button>
    <button class="key utility" onclick="del()">DEL</button>
    <button class="key utility" onclick="percent()">%</button>
    <button class="key operator" onclick="choose('/')">÷</button>

    <button class="key" onclick="digit('7')">7</button>
    <button class="key" onclick="digit('8')">8</button>
    <button class="key" onclick="digit('9')">9</button>
    <button class="key operator" onclick="choose('*')">×</button>

    <button class="key" onclick="digit('4')">4</button>
    <button class="key" onclick="digit('5')">5</button>
    <button class="key" onclick="digit('6')">6</button>
    <button class="key operator" onclick="choose('-')">−</button>

    <button class="key" onclick="digit('1')">1</button>
    <button class="key" onclick="digit('2')">2</button>
    <button class="key" onclick="digit('3')">3</button>
    <button class="key operator" onclick="choose('+')">+</button>

    <button class="key utility" onclick="sign()">+/−</button>
    <button class="key zero" onclick="digit('0')">0</button>
    <button class="key" onclick="digit('.')">.</button>
    <button class="key equal" onclick="calculate()">=</button>
  </div>

  <div class="footer">KALKULATOR PRO • Cepat & Praktis</div>
</div>

<script>
let current = '0';
let stored = null;
let operator = null;
let fresh = false;
let records = [];

const screen = document.getElementById('screen');
const historyText = document.getElementById('history');

function render() {
  screen.textContent = current;
}

function digit(n) {
  if (n === '.') {
    if (fresh) {
      current = '0.';
      fresh = false;
    } else if (!current.includes('.')) {
      current += '.';
    }
  } else {
    if (fresh || current === '0' || current === 'Error') {
      current = n;
      fresh = false;
    } else if (current.replace('-', '').length < 15) {
      current += n;
    }
  }
  render();
}

function format(n) {
  if (!Number.isFinite(n)) return 'Error';
  return String(Number(n.toPrecision(12)));
}

function choose(op) {
  if (current === 'Error') return;
  if (operator && !fresh) calculate();
  stored = Number(current);
  operator = op;
  fresh = true;
  historyText.textContent =
    format(stored) + ' ' + symbol(op);
  render();
}

function symbol(op) {
  return ({'+':'+','-':'−','*':'×','/':'÷'})[op];
}

function calculate() {
  if (operator === null || stored === null || fresh) return;

  const a = stored;
  const b = Number(current);
  let result;

  if (operator === '+') result = a + b;
  if (operator === '-') result = a - b;
  if (operator === '*') result = a * b;
  if (operator === '/') result = b === 0 ? NaN : a / b;

  const expression =
    format(a) + ' ' + symbol(operator) + ' ' + format(b);
  current = format(result);

  if (current === 'Error') {
    historyText.textContent = 'Tidak bisa membagi dengan nol';
  } else {
    historyText.textContent = expression + ' =';
    records.unshift(expression + ' = ' + current);
    records = records.slice(0, 30);
    updateLog();
  }

  stored = null;
  operator = null;
  fresh = true;
  render();
}

function clearAll() {
  current = '0';
  stored = null;
  operator = null;
  fresh = false;
  historyText.textContent = '';
  render();
}

function del() {
  if (fresh || current === 'Error') {
    current = '0';
    fresh = false;
  } else {
    current = current.length > 1
      ? current.slice(0, -1) : '0';
    if (current === '-') current = '0';
  }
  render();
}

function sign() {
  if (current === '0' || current === 'Error') return;
  current = current.startsWith('-')
    ? current.slice(1) : '-' + current;
  render();
}

function percent() {
  if (current === 'Error') return;
  current = format(Number(current) / 100);
  fresh = false;
  render();
}

function toggleHistory() {
  const log = document.getElementById('log');
  log.style.display = log.style.display === 'block'
    ? 'none' : 'block';
}

function updateLog() {
  const log = document.getElementById('log');
  log.replaceChildren();

  if (records.length === 0) {
    const item = document.createElement('div');
    item.textContent = 'Belum ada perhitungan';
    log.appendChild(item);
    return;
  }

  records.forEach(record => {
    const item = document.createElement('div');
    item.textContent = record;
    log.appendChild(item);
  });
}

document.addEventListener('keydown', e => {
  if (/^[0-9.]$/.test(e.key)) digit(e.key);
  else if (['+','-','*','/'].includes(e.key)) choose(e.key);
  else if (e.key === 'Enter' || e.key === '=') calculate();
  else if (e.key === 'Backspace') del();
  else if (e.key === 'Escape') clearAll();
  else return;
  e.preventDefault();
});
</script>
</body>
</html>
